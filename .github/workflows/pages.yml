name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.config.js'
      - 'app.json'
      - 'src/**'
      - 'public/**'
      - 'scripts/generate-web-sw.mjs'
      - 'scripts/check-web-offline.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: '1'
  NIGHTFALL_WEB_BASE_URL: /Nightfall-Stargazing

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:icon
      - run: pnpm typecheck
      - run: pnpm check:privacy
      - run: pnpm check:sky
      - run: pnpm check:state
      - run: pnpm check:android-module
      - run: pnpm export:web
      - run: node --check dist/sw.js
      - run: node scripts/check-web-offline.mjs
      - name: Mark export as static content
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
