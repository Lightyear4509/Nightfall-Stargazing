name: Feature request
description: Suggest a focused improvement to Nightfall Stargazing.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Do not include precise latitude/longitude, observation history, account data, or unique device identifiers."
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the user need or problem this feature would address.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Explain how you expect the app to behave.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Web
        - Both
        - Future iPhone release
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional approaches or workarounds you have tried.
    validations:
      required: false
